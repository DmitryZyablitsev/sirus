# version: '3.8'

services:
  app:
    # container_name: sirus не обязательно
    image: dimazyablicev/sirus:latest
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      - db
    environment:
      - RAILS_ENV=${RAILS_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    # ports:
    #   - "3000:3000"
    volumes:
      - ./tmp:/app/tmp
      - ./logs:/app/log

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=sirus_production
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6666:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - webnet

  nginx:
    container_name: nginx
    image: nginx:latest
    depends_on:
      - app
    volumes:
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./public:/app/public
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - webnet

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ""
    command: >
      sh -c "
      if [ ! -f /etc/letsencrypt/live/lumeko.ru/fullchain.pem ]; then
        certbot certonly --webroot -w /var/www/certbot --email uksm.vas@mail.ru -d lumeko.ru --agree-tos --non-interactive;
      else
        certbot renew --quiet;
      fi"
    depends_on:
      - nginx
    networks:
      - webnet

volumes:
  postgres_data:

networks:
  webnet:
    driver: bridge
